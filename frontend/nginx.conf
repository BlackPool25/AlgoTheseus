server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # COOP/COEP (task 19): enable crossOriginIsolated for the future
    # browser-WASM path; app falls back to server path when SAB is disabled.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # SPA fallback — serve index.html for all frontend routes
    # index.html is never cached (Vite hashes assets; html is the manifest)
    location / {
        try_files $uri $uri/ /index.html;

        expires -1;
        add_header Cache-Control "no-cache" always;

        # CORS for SPA routes (nginx handles 404s that become index.html)
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Hashed Vite assets — fingerprinted, safe to cache immutably for 1y
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # Belt-and-braces: hashed .js/.css outside /assets/ (if any)
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # API proxy — streaming traces require buffering off
    # Uses a variable so nginx doesn't fail to start if backend is unavailable
    location /api/ {
        set $backend_url "http://backend:8000/";
        proxy_pass $backend_url;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
    }

    # Health check proxy — never cached
    location /health {
        expires off;
        set $backend_health_url "http://backend:8000/health";
        proxy_pass $backend_health_url;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API routes used by the frontend (without /api/ prefix)
    location /execute {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
    }

    location /execute-batch {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
    }

    location /upload-testcases {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }
}

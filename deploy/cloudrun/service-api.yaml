# =============================================================================
# AlgoTheseus — Cloud Run API service (serving.knative.dev/v1)
# =============================================================================
# Apply:   gcloud run services replace deploy/cloudrun/service-api.yaml --region=$REGION
# Dry-run: gcloud run services replace deploy/cloudrun/service-api.yaml --region=$REGION --dry-run
# Image placeholder _IMAGE is rewritten by deploy.sh / cloudbuild substitutions.
# =============================================================================

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: algo-theseus-api
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/execution-environment: gen2 # gen2: faster g++ subprocess cold starts (same cost)
    # (was gen1 gVisor fork/exec)
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1" # Wave8: keep 1 warm instance to absorb burst cold-start
        autoscaling.knative.dev/maxScale: "20" # Wave8: doubled from 10 for burst headroom
        run.googleapis.com/cpu-throttling: "false" # keep CPU during g++ jail + streaming
        run.googleapis.com/startup-cpu-boost: "true" # blunt cold starts (~60s SnapDeploy / ~1min Render)
    spec:
      containerConcurrency: 20 # Wave8: raised from 15; single uvicorn handles 20 concurrent without pool exhaustion
      timeoutSeconds: 300
      containers:
        - image: _IMAGE
          name: api
          ports:
            - containerPort: 8000 # Cloud Run injects $PORT; image honors ${PORT:-8000}
          env:
            - name: SANDBOX_MODE
              value: subprocess
            - name: CACHE_DIR
              value: /tmp/algo-theseus-cache # ephemeral: restart wipes it, cold MISS expected
            - name: MAX_BATCH_SANDBOXES
              value: "4" # Wave8: doubled from 2; gen2 handles 4 concurrent sandbox spawns
            - name: SANDBOX_MAX_CONCURRENT
              value: "6" # Wave8: cap total in-flight sandbox executions per instance
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: algo-theseus-redis-url
                  key: latest
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /health
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
            periodSeconds: 30
  traffic:
    - percent: 100
      latestRevision: true

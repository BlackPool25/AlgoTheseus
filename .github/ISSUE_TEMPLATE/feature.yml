name: Feature request
description: Suggest an idea or improvement for AlgoTheseus.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve, and who feels it?
      placeholder: As a ..., I struggle with ... because ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change or be added?
      placeholder: Describe the change and how it behaves.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why they fall short.
      placeholder: Alternative 1 ... drawback ...
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project does this touch?
      options:
        - frontend
        - backend
        - instrumenter
        - docs
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and discussions for similar ideas.
          required: true

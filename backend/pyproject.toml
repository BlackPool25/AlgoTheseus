[project]
name = "algo-theseus-backend"
version = "0.1.0"
description = "C++ DSA trace visualiser backend — libclang instrumentation + Docker sandbox"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.34.3",
    "pydantic==2.11.4",
    # Toolchain pin (Task W0.1): libclang==18.1.1 bundles MATCHED Python bindings
    # (clang/cindex.py) + native lib (clang/native/libclang.so) — it IS the pin.
    # Do NOT add the obsolete PyPI `clang` package (latest release 9.0, no 18.x
    # wheel exists; it also collides with libclang on the `clang/` package dir).
    # _find_libclang must resolve the bundled native lib, never system libclang.
    "libclang==18.1.1",
    "docker==7.1.0",
    "httpx==0.28.1",
    "slowapi==0.1.10",
    "orjson>=3",
    "python-multipart>=0.0.32",
    "redis>=5",
    "pytest-xdist[dev]>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.25.3",
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "serial_only: snapshots process-global /tmp state; deselect with -m 'not serial_only' for xdist runs",
]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "fakeredis>=2.38.0",
    "lupa>=2.8",
]

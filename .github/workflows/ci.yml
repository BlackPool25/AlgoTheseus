# CI: push/PR checks (lint, pytest, web, links) + nightly visual suite.
#
# Commands mirror CONTRIBUTING.md / README.md "Testing" / frontend/README.md
# exactly — CONTRIBUTING wins on any drift. Do NOT run the pipeline locally
# here; this file is validated statically (yaml.safe_load + pin audit).
#
# Nightly-only suites are NEVER required push/PR checks —
# see the `visual-nightly` job (workflow_dispatch + schedule only).

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *" # nightly visual-regression window (UTC)

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - working-directory: backend
        run: ruff check .
      - working-directory: backend
        run: ruff format --check .

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install uv
      - working-directory: backend
        run: uv sync --extra dev
      # TODO(ci-sandbox): Docker-in-Docker may be unavailable on some
      # runners; the build is best-effort and pytest falls back to
      # `-m 'not sandbox'` so push/PR stays green without the image.
      - name: Build sandbox image
        id: sandbox
        continue-on-error: true
        run: docker build -f backend/docker/Dockerfile.sandbox -t algo-theseus-sandbox:latest backend/docker/
      - name: Run pytest (full)
        if: steps.sandbox.outcome == 'success'
        working-directory: backend
        run: uv run pytest tests/ -v
      - name: Run pytest (no sandbox fallback)
        if: steps.sandbox.outcome != 'success'
        working-directory: backend
        run: uv run pytest tests/ -v -m 'not sandbox'

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - working-directory: frontend
        run: bun install --frozen-lockfile
      - working-directory: frontend
        run: npx tsc -b --noEmit
      - working-directory: frontend
        run: npx eslint .
      - working-directory: frontend
        run: bun run build

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --no-progress README.md CONTRIBUTING.md frontend/README.md 'docs/**/*.md'

  visual-nightly:
    # Nightly-only gate: Playwright runs on schedule + workflow_dispatch ONLY,
    # never as a required push/PR check. (k6 load tests likewise live outside
    # required checks — see k6-prod.yml, owned by todo 16.)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - working-directory: frontend
        run: bun install --frozen-lockfile
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npx playwright test

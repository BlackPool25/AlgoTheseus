# AlgoTheseus — Cloud Build: backend image -> Artifact Registry
# Run: gcloud builds submit --config deploy/cloudrun/cloudbuild.yaml \
#        --substitutions=_REGION=asia-south1,_REPO=algo-theseus,_SERVICE=algo-theseus-api ./backend
# deploy.sh wraps this; `gcloud run services replace` then stamps _IMAGE.

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:$COMMIT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:latest
      - .

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/backend:latest

substitutions:
  _REGION: asia-south1
  _REPO: algo-theseus
  _SERVICE: algo-theseus-api

options:
  logging: CLOUD_LOGGING_ONLY

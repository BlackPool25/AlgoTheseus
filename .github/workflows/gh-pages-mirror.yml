# GH Pages mirror workflow — MIRROR ONLY, not a primary host (todo 21, D4).
#
# HEADER LIMITATION (read before relying on this): GitHub Pages serves static
# files only and offers NO custom-header mechanism — there is no _headers
# equivalent, so COOP/COEP can never be set here. Consequence:
# crossOriginIsolated is always false on this mirror, SharedArrayBuffer is
# unavailable, and the app permanently takes the server execution path
# (executionEngine.ts falls back when !crossOriginIsolated). WASM-immune by
# construction: the D1 kill-criteria already removed browser-WASM as primary,
# so this mirror loses nothing — it renders the same server-driven replay.
#
# The mirror builds with VITE_BASE=/<repo>/ so asset URLs stay same-origin
# under the project subpath (see vite.config.ts base).

name: gh-pages-mirror

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [frontend/**]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gh-pages-mirror
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - working-directory: frontend
        run: bun install --frozen-lockfile
      - working-directory: frontend
        run: bun run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

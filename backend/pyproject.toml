[project]
name = "dsa-visualiser-backend"
version = "0.1.0"
description = "C++ DSA trace visualiser backend — libclang instrumentation + Docker sandbox"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.3",
    "pydantic==2.11.4",
    "libclang==18.1.1",
    "docker==7.1.0",
    "httpx==0.28.1",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.25.3",
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
